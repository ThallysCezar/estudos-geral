<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 680" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1e1f29; }
      .title { font-family: 'Inter', -apple-system, sans-serif; font-size: 20px; font-weight: 800; fill: #f8f8f2; letter-spacing: -0.5px; }
      .subtitle { font-family: 'Georgia', serif; font-size: 13px; font-style: italic; fill: #9aa1c0; }
      .layer-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 13px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
      .layer-sub { font-family: 'Inter', -apple-system, sans-serif; font-size: 10px; fill: #9aa1c0; }
      .pill-text { font-family: 'Cascadia Code', monospace; font-size: 10.5px; font-weight: 600; }
      .core-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 15px; font-weight: 800; fill: #ff79c6; }
      .core-sub { font-family: 'Inter', -apple-system, sans-serif; font-size: 10px; fill: #f8f8f2; }
    </style>
    <!-- Gradientes -->
    <radialGradient id="grad-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff79c6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#282a36" stop-opacity="0.95"/>
    </radialGradient>
    <radialGradient id="grad-dl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bd93f9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#21222c" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="grad-ml" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#50fa7b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1e1f29" stop-opacity="0.8"/>
    </radialGradient>
    <radialGradient id="grad-ia" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f1fa8c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1e1f29" stop-opacity="0.75"/>
    </radialGradient>
    <!-- Filtros de sombra suave -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="860" height="680" rx="16" class="bg"/>
  <rect x="1" y="1" width="858" height="678" rx="15" fill="none" stroke="#343746" stroke-width="1.5"/>

  <!-- Cabeçalho -->
  <g transform="translate(40, 42)">
    <text class="title" x="0" y="0">A Arquitetura em Camadas: Da Ciência da Computação à IA Generativa</text>
    <text class="subtitle" x="0" y="20">O mapa de cebola: cada camada interna herda os fundamentos e restrições da camada que a envolve.</text>
  </g>

  <!-- Centro dos círculos concêntricos: cx=430, cy=375 -->
  <g transform="translate(0, 20)">

    <!-- CAMADA 5: CIÊNCIA DA COMPUTAÇÃO (Exterior) r=270 -->
    <circle cx="430" cy="355" r="270" fill="#282a36" stroke="#44475a" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text class="layer-title" x="430" y="110" fill="#ffb86c" text-anchor="middle">1. Ciência da Computação (Fundação de Engenharia)</text>
    <text class="layer-sub" x="430" y="125" text-anchor="middle">Sistemas Operacionais · Estruturas de Dados · Teoria dos Grafos · Redes · Compiladores</text>
    
    <!-- Badges CC -->
    <g transform="translate(190, 140)">
      <rect width="78" height="24" rx="6" fill="#21222c" stroke="#ffb86c" stroke-width="1"/>
      <text class="pill-text" x="39" y="16" fill="#ffb86c" text-anchor="middle">Java 21</text>
    </g>
    <g transform="translate(590, 140)">
      <rect width="78" height="24" rx="6" fill="#21222c" stroke="#ffb86c" stroke-width="1"/>
      <text class="pill-text" x="39" y="16" fill="#ffb86c" text-anchor="middle">Python</text>
    </g>
    <g transform="translate(175, 530)">
      <rect width="96" height="24" rx="6" fill="#21222c" stroke="#6272a4" stroke-width="1"/>
      <text class="pill-text" x="48" y="16" fill="#9aa1c0" text-anchor="middle">C++ / Rust</text>
    </g>
    <g transform="translate(575, 530)">
      <rect width="115" height="24" rx="6" fill="#21222c" stroke="#6272a4" stroke-width="1"/>
      <text class="pill-text" x="57" y="16" fill="#9aa1c0" text-anchor="middle">Concorrência</text>
    </g>

    <!-- CAMADA 4: INTELIGÊNCIA ARTIFICIAL (r=215) -->
    <circle cx="430" cy="355" r="215" fill="url(#grad-ia)" stroke="#f1fa8c" stroke-width="1.5" filter="url(#shadow)"/>
    <text class="layer-title" x="430" y="165" fill="#f1fa8c" text-anchor="middle">2. Inteligência Artificial (O Campo Amplo)</text>
    <text class="layer-sub" x="430" y="180" text-anchor="middle">Capacidade de máquinas imitarem funções cognitivas humanas</text>

    <!-- Badges IA -->
    <g transform="translate(235, 230)">
      <rect width="65" height="22" rx="6" fill="#1e1f29" stroke="#f1fa8c" stroke-width="1"/>
      <text class="pill-text" x="32" y="15" fill="#f1fa8c" text-anchor="middle">PLN / NLP</text>
    </g>
    <g transform="translate(555, 230)">
      <rect width="78" height="22" rx="6" fill="#1e1f29" stroke="#f1fa8c" stroke-width="1"/>
      <text class="pill-text" x="39" y="15" fill="#f1fa8c" text-anchor="middle">Visão Comp.</text>
    </g>
    <g transform="translate(240, 470)">
      <rect width="72" height="22" rx="6" fill="#1e1f29" stroke="#6272a4" stroke-width="1"/>
      <text class="pill-text" x="36" y="15" fill="#9aa1c0" text-anchor="middle">Robótica</text>
    </g>
    <g transform="translate(545, 470)">
      <rect width="85" height="22" rx="6" fill="#1e1f29" stroke="#6272a4" stroke-width="1"/>
      <text class="pill-text" x="42" y="15" fill="#9aa1c0" text-anchor="middle">Sistemas Regras</text>
    </g>

    <!-- CAMADA 3: MACHINE LEARNING (r=160) -->
    <circle cx="430" cy="355" r="160" fill="url(#grad-ml)" stroke="#50fa7b" stroke-width="2" filter="url(#shadow)"/>
    <text class="layer-title" x="430" y="218" fill="#50fa7b" text-anchor="middle">3. Machine Learning (Aprende com Dados)</text>
    <text class="layer-sub" x="430" y="232" text-anchor="middle">Otimização estatística de pesos a partir de dados históricos</text>

    <!-- Badges ML -->
    <g transform="translate(285, 290)">
      <rect width="84" height="22" rx="6" fill="#173726" stroke="#50fa7b" stroke-width="1"/>
      <text class="pill-text" x="42" y="15" fill="#50fa7b" text-anchor="middle">Supervisionado</text>
    </g>
    <g transform="translate(485, 290)">
      <rect width="98" height="22" rx="6" fill="#173726" stroke="#50fa7b" stroke-width="1"/>
      <text class="pill-text" x="49" y="15" fill="#50fa7b" text-anchor="middle">Não Supervisionado</text>
    </g>
    <g transform="translate(365, 420)">
      <rect width="130" height="22" rx="6" fill="#173726" stroke="#50fa7b" stroke-width="1"/>
      <text class="pill-text" x="65" y="15" fill="#50fa7b" text-anchor="middle">Reinforcement Learning</text>
    </g>

    <!-- CAMADA 2: DEEP LEARNING (r=105) -->
    <circle cx="430" cy="355" r="105" fill="url(#grad-dl)" stroke="#bd93f9" stroke-width="2" filter="url(#shadow)"/>
    <text class="layer-title" x="430" y="272" fill="#bd93f9" text-anchor="middle">4. Deep Learning</text>
    <text class="layer-sub" x="430" y="285" text-anchor="middle">Redes Neurais Profundas com Múltiplas Camadas</text>

    <!-- Badges DL -->
    <text class="pill-text" x="375" y="320" fill="#bd93f9" text-anchor="middle">CNNs · RNNs</text>
    <text class="pill-text" x="485" y="320" fill="#bd93f9" text-anchor="middle">Transformer</text>

    <!-- CAMADA 1: NÚCLEO - GENERATIVE AI & LLMs (r=55) -->
    <circle cx="430" cy="355" r="55" fill="url(#grad-core)" stroke="#ff79c6" stroke-width="2.5" filter="url(#shadow)"/>
    <circle cx="430" cy="355" r="50" fill="none" stroke="#ff79c6" stroke-width="1" stroke-dasharray="3 3"/>
    <text class="core-title" x="430" y="350" text-anchor="middle">LLMs</text>
    <text class="core-sub" x="430" y="366" text-anchor="middle">GenAI</text>
    <text style="font-family:'Cascadia Code',monospace;font-size:8px;fill:#ff79c6;font-weight:700" x="430" y="380" text-anchor="middle">GPT · Claude · Gemini</text>

  </g>
</svg>
