<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 820" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1a1b26; }
      .header-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 24px; font-weight: 900; fill: #f8f8f2; letter-spacing: -0.5px; }
      .header-sub { font-family: 'Georgia', serif; font-size: 13.5px; font-style: italic; fill: #8be9fd; }
      .slogan { font-family: 'Cascadia Code', monospace; font-size: 11px; fill: #50fa7b; font-weight: 600; }
      .card-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 14px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; }
      .card-sub { font-family: 'Inter', -apple-system, sans-serif; font-size: 10.5px; font-weight: 600; }
      .card-desc { font-family: 'Inter', -apple-system, sans-serif; font-size: 11px; fill: #dcdce0; line-height: 1.45; }
      .list-head { font-family: 'Inter', -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #f8f8f2; }
      .list-item { font-family: 'Inter', -apple-system, sans-serif; font-size: 10px; fill: #9aa1c0; }
      .badge-txt { font-family: 'Cascadia Code', monospace; font-size: 9.5px; font-weight: 700; }
      .hub-txt { font-family: 'Inter', -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #f8f8f2; }
    </style>
    <filter id="shadow-card" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="1080" height="820" rx="18" class="bg"/>
  <rect x="1" y="1" width="1078" height="818" rx="17" fill="none" stroke="#343746" stroke-width="1.5"/>

  <!-- ================= TOP HEADER ================= -->
  <g transform="translate(45, 42)">
    <text class="header-title" x="0" y="0">O ECOSSISTEMA COMPLETO DA INTELIGÊNCIA ARTIFICIAL</text>
    <text class="header-sub" x="0" y="22">"Mais do que apenas código ou matemática: a união de Dados + Modelos + Ferramentas para resolver problemas reais."</text>
    <text class="slogan" x="990" y="5" text-anchor="end">DADOS + ALGORITMOS + AGENTES = VALOR REAL</text>
  </g>

  <!-- ================= 4 PILARES (CARDS) ================= -->

  <!-- PILAR 1: MACHINE LEARNING (Azul / Top-Left) -->
  <g transform="translate(45, 95)" filter="url(#shadow-card)">
    <rect width="235" height="420" rx="14" fill="#1e2233" stroke="#8be9fd" stroke-width="1.8"/>
    <rect x="0" y="0" width="235" height="46" rx="14" fill="#242b42"/>
    <path d="M 0 32 L 0 46 L 235 46 L 235 32 Z" fill="#242b42"/>
    <text class="card-title" x="16" y="28" fill="#8be9fd">1. Machine Learning</text>
    
    <g transform="translate(16, 62)">
      <text class="card-sub" x="0" y="0" fill="#8be9fd">A Base da IA</text>
      <text class="card-desc" x="0" y="18">Permite que sistemas aprendam</text>
      <text class="card-desc" x="0" y="34">padrões a partir de dados sem</text>
      <text class="card-desc" x="0" y="50">regras manuais em if/else.</text>

      <line x1="0" y1="65" x2="200" y2="65" stroke="#343746" stroke-width="1"/>

      <text class="list-head" x="0" y="84">Três Tipos Principais:</text>
      <text class="list-item" x="0" y="102">🔹 <tspan fill="#f8f8f2" font-weight="600">Supervisionado:</tspan> com rótulos</text>
      <text class="list-item" x="0" y="118">    (ex: prever preço, spam)</text>
      <text class="list-item" x="0" y="138">🔹 <tspan fill="#f8f8f2" font-weight="600">Não Supervisionado:</tspan> sem rótulos</text>
      <text class="list-item" x="0" y="154">    (clusterização de clientes)</text>
      <text class="list-item" x="0" y="174">🔹 <tspan fill="#f8f8f2" font-weight="600">Por Reforço (RL):</tspan> por tentativa</text>
      <text class="list-item" x="0" y="190">    e penalidade/recompensa</text>

      <line x1="0" y1="208" x2="200" y2="208" stroke="#343746" stroke-width="1"/>

      <text class="list-head" x="0" y="226">Casos Práticos de Uso:</text>
      <text class="list-item" x="0" y="244">• Detecção de fraudes bancárias</text>
      <text class="list-item" x="0" y="260">• Recomendação de e-commerce</text>
      <text class="list-item" x="0" y="276">• Manutenção preditiva em IoT</text>
      <text class="list-item" x="0" y="292">• Previsão de séries temporais</text>
    </g>
  </g>

  <!-- PILAR 2: LLMS (Amarelo / Top-Mid-Left) -->
  <g transform="translate(295, 95)" filter="url(#shadow-card)">
    <rect width="235" height="420" rx="14" fill="#252422" stroke="#f1fa8c" stroke-width="1.8"/>
    <rect x="0" y="0" width="235" height="46" rx="14" fill="#363426"/>
    <path d="M 0 32 L 0 46 L 235 46 L 235 32 Z" fill="#363426"/>
    <text class="card-title" x="16" y="28" fill="#f1fa8c">2. LLMs (Linguagem)</text>

    <g transform="translate(16, 62)">
      <text class="card-sub" x="0" y="0" fill="#f1fa8c">O Motor de Raciocínio</text>
      <text class="card-desc" x="0" y="18">Modelos de Deep Learning treinados</text>
      <text class="card-desc" x="0" y="34">em bilhões de textos para entender</text>
      <text class="card-desc" x="0" y="50">contexto, gerar texto e código.</text>

      <line x1="0" y1="65" x2="200" y2="65" stroke="#343746" stroke-width="1"/>

      <text class="list-head" x="0" y="84">Capacidades Centrais:</text>
      <text class="list-item" x="0" y="102">✓ Interpretação semântica profunda</text>
      <text class="list-item" x="0" y="118">✓ Geração e refatoração de código</text>
      <text class="list-item" x="0" y="134">✓ Síntese e extração de entidades</text>
      <text class="list-item" x="0" y="150">✓ Tradução e reestruturação</text>

      <line x1="0" y1="168" x2="200" y2="168" stroke="#343746" stroke-width="1"/>

      <text class="list-head" x="0" y="186">Principais Motores do Mercado:</text>
      
      <!-- Badges de modelos -->
      <g transform="translate(0, 198)">
        <rect width="94" height="22" rx="5" fill="#1e1f29" stroke="#f1fa8c" stroke-width="1"/>
        <text class="badge-txt" x="47" y="15" fill="#f1fa8c" text-anchor="middle">GPT-4o</text>

        <rect x="102" width="96" height="22" rx="5" fill="#1e1f29" stroke="#ffb86c" stroke-width="1"/>
        <text class="badge-txt" x="150" y="15" fill="#ffb86c" text-anchor="middle">Claude 3.7</text>

        <rect y="30" width="94" height="22" rx="5" fill="#1e1f29" stroke="#8be9fd" stroke-width="1"/>
        <text class="badge-txt" x="47" y="45" fill="#8be9fd" text-anchor="middle">Gemini 2.0</text>

        <rect x="102" y="30" width="96" height="22" rx="5" fill="#1e1f29" stroke="#50fa7b" stroke-width="1"/>
        <text class="badge-txt" x="150" y="45" fill="#50fa7b" text-anchor="middle">Llama 3.3</text>

        <rect y="60" width="94" height="22" rx="5" fill="#1e1f29" stroke="#bd93f9" stroke-width="1"/>
        <text class="badge-txt" x="47" y="75" fill="#bd93f9" text-anchor="middle">Mistral</text>

        <rect x="102" y="60" width="96" height="22" rx="5" fill="#1e1f29" stroke="#ff79c6" stroke-width="1"/>
        <text class="badge-txt" x="150" y="75" fill="#ff79c6" text-anchor="middle">DeepSeek</text>
      </g>
    </g>
  </g>

  <!-- PILAR 3: MODELOS DE IA DIVERSOS (Roxo / Top-Mid-Right) -->
  <g transform="translate(545, 95)" filter="url(#shadow-card)">
    <rect width="235" height="420" rx="14" fill="#242033" stroke="#bd93f9" stroke-width="1.8"/>
    <rect x="0" y="0" width="235" height="46" rx="14" fill="#332a4e"/>
    <path d="M 0 32 L 0 46 L 235 46 L 235 32 Z" fill="#332a4e"/>
    <text class="card-title" x="16" y="28" fill="#bd93f9">3. Modelos de IA</text>

    <g transform="translate(16, 62)">
      <text class="card-sub" x="0" y="0" fill="#bd93f9">Especialidades Diversas</text>
      <text class="card-desc" x="0" y="18">Além de texto, cada modalidade de</text>
      <text class="card-desc" x="0" y="34">dados possui arquiteturas e modelos</text>
      <text class="card-desc" x="0" y="50">especializados no estado da arte.</text>

      <line x1="0" y1="65" x2="200" y2="65" stroke="#343746" stroke-width="1"/>

      <text class="list-head" x="0" y="84">Modalidades Técnicas:</text>
      
      <text class="list-item" x="0" y="104">💬 <tspan fill="#f8f8f2" font-weight="600">Texto &amp; Código:</tspan> LLMs</text>
      <text class="list-item" x="0" y="120">    GPT, Claude, DeepSeek</text>

      <text class="list-item" x="0" y="140">🎨 <tspan fill="#f8f8f2" font-weight="600">Geração de Imagens:</tspan> Difusão</text>
      <text class="list-item" x="0" y="156">    DALL-E 3, Midjourney, Flux</text>

      <text class="list-item" x="0" y="176">🎙️ <tspan fill="#f8f8f2" font-weight="600">Áudio &amp; Fala:</tspan> STT e TTS</text>
      <text class="list-item" x="0" y="192">    Whisper (transcrição), ElevenLabs</text>

      <text class="list-item" x="0" y="212">🌐 <tspan fill="#f8f8f2" font-weight="600">Multimodais Nativos:</tspan></text>
      <text class="list-item" x="0" y="228">    Texto + Imagem + Vídeo unificados</text>

      <text class="list-item" x="0" y="248">🔬 <tspan fill="#f8f8f2" font-weight="600">Especializados na Ciência:</tspan></text>
      <text class="list-item" x="0" y="264">    AlphaFold (3D), Clima e Finanças</text>
    </g>
  </g>

  <!-- PILAR 4: AGENTES DE IA (Verde / Top-Right) -->
  <g transform="translate(795, 95)" filter="url(#shadow-card)">
    <rect width="240" height="420" rx="14" fill="#1a2b22" stroke="#50fa7b" stroke-width="1.8"/>
    <rect x="0" y="0" width="240" height="46" rx="14" fill="#203d2b"/>
    <path d="M 0 32 L 0 46 L 240 46 L 240 32 Z" fill="#203d2b"/>
    <text class="card-title" x="16" y="28" fill="#50fa7b">4. Agentes de IA</text>

    <g transform="translate(16, 62)">
      <text class="card-sub" x="0" y="0" fill="#50fa7b">Autonomia que Age no Mundo</text>
      <text class="card-desc" x="0" y="18">Sistemas que usam o LLM para</text>
      <text class="card-desc" x="0" y="34">planejar, usar ferramentas e agir</text>
      <text class="card-desc" x="0" y="50">de forma iterativa até o objetivo.</text>

      <line x1="0" y1="65" x2="205" y2="65" stroke="#343746" stroke-width="1"/>

      <text class="list-head" x="0" y="84">Os 5 Poderes do Agente:</text>
      <text class="list-item" x="0" y="102">1. 🎯 Compreender objetivo de negócio</text>
      <text class="list-item" x="0" y="120">2. 📋 Decompor e planejar passos</text>
      <text class="list-item" x="0" y="138">3. 🛠️ Chamar Ferramentas (APIs, SQL, Git)</text>
      <text class="list-item" x="0" y="156">4. ⚙️ Executar tarefas em loop</text>
      <text class="list-item" x="0" y="174">5. 🔄 Auto-ajustar com base nos erros</text>

      <line x1="0" y1="192" x2="205" y2="192" stroke="#343746" stroke-width="1"/>

      <text class="list-head" x="0" y="210">Exemplos de Arquétipos:</text>
      <text class="list-item" x="0" y="228">• Agente Dev (gera, compila e testa)</text>
      <text class="list-item" x="0" y="246">• Agente Pesquisa (sintetiza docs)</text>
      <text class="list-item" x="0" y="264">• Agente Dados (executa queries SQL)</text>
      <text class="list-item" x="0" y="282">• Agente SRE (investiga incidentes)</text>
    </g>
  </g>

  <!-- ================= HUB CENTRAL CONECTADO ================= -->
  <g transform="translate(45, 535)">
    <!-- Barra de integração do ecossistema -->
    <rect width="990" height="110" rx="14" fill="#21222c" stroke="#44475a" stroke-width="1.5" filter="url(#shadow-card)"/>

    <!-- 4 Conectores verticais que descem dos cards -->
    <path d="M 115 -18 L 115 0" stroke="#8be9fd" stroke-width="2" stroke-dasharray="3 3"/>
    <path d="M 370 -18 L 370 0" stroke="#f1fa8c" stroke-width="2" stroke-dasharray="3 3"/>
    <path d="M 620 -18 L 620 0" stroke="#bd93f9" stroke-width="2" stroke-dasharray="3 3"/>
    <path d="M 870 -18 L 870 0" stroke="#50fa7b" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Conteúdo Central -->
    <g transform="translate(40, 32)">
      <circle cx="20" cy="20" r="28" fill="#332a4e" stroke="#bd93f9" stroke-width="2"/>
      <text style="font-family:'Inter',sans-serif;font-size:18px;font-weight:900;fill:#bd93f9" x="20" y="26" text-anchor="middle">⚙️</text>
      
      <g transform="translate(70, 8)">
        <text class="hub-txt" x="0" y="0">A FORÇA DO DESENVOLVEDOR: INTEGRAR OS 4 PILARES</text>
        <text style="font-family:'Inter',sans-serif;font-size:11px;fill:#dcdce0" x="0" y="20">
          A IA moderna não é um modelo isolado que você chama no navegador. O trabalho do Engenheiro de IA é orquestrar:
        </text>
        <text style="font-family:'Cascadia Code',monospace;font-size:10px;fill:#50fa7b" x="0" y="38">
          [Dados de Negócio] ➔ [Modelos Especializados] ➔ [Prompt / SDD] ➔ [Agentes com Tools] ➔ [Software Confiável]
        </text>
      </g>
    </g>
  </g>

  <!-- ================= FAIXA INFERIOR DE IMPACTO REAL ================= -->
  <g transform="translate(45, 665)">
    <text style="font-family:'Inter',sans-serif;font-size:11px;font-weight:800;letter-spacing:1px;fill:#9aa1c0;text-transform:uppercase" x="0" y="0">Aplicações Reais da IA nas Indústrias:</text>
    
    <g transform="translate(0, 15)">
      <!-- Saúde -->
      <rect width="115" height="52" rx="8" fill="#1e1f29" stroke="#343746"/>
      <text style="font-family:'Inter',sans-serif;font-size:10px;font-weight:700;fill:#ff5555" x="12" y="22">❤️ Saúde</text>
      <text style="font-family:'Inter',sans-serif;font-size:8.5px;fill:#9aa1c0" x="12" y="38">Diagnóstico &amp; Triagem</text>

      <!-- Finanças -->
      <g transform="translate(125, 0)">
        <rect width="115" height="52" rx="8" fill="#1e1f29" stroke="#343746"/>
        <text style="font-family:'Inter',sans-serif;font-size:10px;font-weight:700;fill:#50fa7b" x="12" y="22">💰 Finanças</text>
        <text style="font-family:'Inter',sans-serif;font-size:8.5px;fill:#9aa1c0" x="12" y="38">Fraude &amp; Risco</text>
      </g>

      <!-- Varejo -->
      <g transform="translate(250, 0)">
        <rect width="115" height="52" rx="8" fill="#1e1f29" stroke="#343746"/>
        <text style="font-family:'Inter',sans-serif;font-size:10px;font-weight:700;fill:#ffb86c" x="12" y="22">🛒 E-Commerce</text>
        <text style="font-family:'Inter',sans-serif;font-size:8.5px;fill:#9aa1c0" x="12" y="38">Busca &amp; Recomendações</text>
      </g>

      <!-- Indústria -->
      <g transform="translate(375, 0)">
        <rect width="115" height="52" rx="8" fill="#1e1f29" stroke="#343746"/>
        <text style="font-family:'Inter',sans-serif;font-size:10px;font-weight:700;fill:#f1fa8c" x="12" y="22">🏭 Indústria</text>
        <text style="font-family:'Inter',sans-serif;font-size:8.5px;fill:#9aa1c0" x="12" y="38">Manutenção Preditiva</text>
      </g>

      <!-- Educação -->
      <g transform="translate(500, 0)">
        <rect width="115" height="52" rx="8" fill="#1e1f29" stroke="#343746"/>
        <text style="font-family:'Inter',sans-serif;font-size:10px;font-weight:700;fill:#bd93f9" x="12" y="22">🎓 Educação</text>
        <text style="font-family:'Inter',sans-serif;font-size:8.5px;fill:#9aa1c0" x="12" y="38">Tutoria Adaptativa</text>
      </g>

      <!-- Meio Ambiente -->
      <g transform="translate(625, 0)">
        <rect width="115" height="52" rx="8" fill="#1e1f29" stroke="#343746"/>
        <text style="font-family:'Inter',sans-serif;font-size:10px;font-weight:700;fill:#50fa7b" x="12" y="22">🌱 Clima</text>
        <text style="font-family:'Inter',sans-serif;font-size:8.5px;fill:#9aa1c0" x="12" y="38">Previsão Geoespacial</text>
      </g>

      <!-- Tecnologia / Software -->
      <g transform="translate(750, 0)">
        <rect width="115" height="52" rx="8" fill="#173726" stroke="#50fa7b"/>
        <text style="font-family:'Inter',sans-serif;font-size:10px;font-weight:700;fill:#50fa7b" x="12" y="22">💻 Software Dev</text>
        <text style="font-family:'Inter',sans-serif;font-size:8.5px;fill:#f8f8f2" x="12" y="38">Copilots &amp; Agentes</text>
      </g>

      <!-- Jurídico / Docs -->
      <g transform="translate(875, 0)">
        <rect width="115" height="52" rx="8" fill="#1e1f29" stroke="#343746"/>
        <text style="font-family:'Inter',sans-serif;font-size:10px;font-weight:700;fill:#8be9fd" x="12" y="22">⚖️ Gestão &amp; Ops</text>
        <text style="font-family:'Inter',sans-serif;font-size:8.5px;fill:#9aa1c0" x="12" y="38">Análise de Contratos</text>
      </g>
    </g>
  </g>
</svg>
