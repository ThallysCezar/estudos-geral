<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1e1f29; }
      .title { font-family: 'Inter', -apple-system, sans-serif; font-size: 18px; font-weight: 800; fill: #f8f8f2; letter-spacing: -0.5px; }
      .subtitle { font-family: 'Georgia', serif; font-size: 12.5px; font-style: italic; fill: #9aa1c0; }
      .h-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 16px; font-weight: 800; }
      .h-sub { font-family: 'Inter', -apple-system, sans-serif; font-size: 11px; fill: #9aa1c0; }
      .h-desc { font-family: 'Inter', -apple-system, sans-serif; font-size: 9.5px; fill: #dcdce0; }
      .app-pill { font-family: 'Inter', -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #f8f8f2; }
    </style>
    <filter id="shadow-h" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="grad-arrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb86c"/>
      <stop offset="30%" stop-color="#50fa7b"/>
      <stop offset="60%" stop-color="#bd93f9"/>
      <stop offset="100%" stop-color="#8be9fd"/>
    </linearGradient>
  </defs>

  <rect width="940" height="300" rx="16" class="bg"/>
  <rect x="1" y="1" width="938" height="298" rx="15" fill="none" stroke="#343746" stroke-width="1.5"/>

  <!-- Título -->
  <g transform="translate(35, 36)">
    <text class="title" x="0" y="0">O Funil de Escala: Da Teoria Ampla aos Produtos de IA</text>
    <text class="subtitle" x="0" y="18">Como a ciência da computação afunila a inteligência estatística até a interface que o usuário final utiliza.</text>
  </g>

  <!-- Linha de Fluxo / Conector de Escala -->
  <path d="M 40 78 L 900 78" stroke="url(#grad-arrow)" stroke-width="2" stroke-opacity="0.4"/>
  <text style="font-family:'Cascadia Code',monospace;font-size:9.5px;fill:#8be9fd;font-weight:600" x="895" y="72" text-anchor="end">DO FUNDAMENTO MATEMÁTICO AO PRODUTO ACABADO ➔</text>

  <!-- Container dos Nós -->
  <g transform="translate(10, 85)">

    <!-- CÍRCULO 1: IA (Laranja / Salmão) cx=100, cy=95, r=85 -->
    <circle cx="105" cy="95" r="82" fill="#282a36" stroke="#ffb86c" stroke-width="2" filter="url(#shadow-h)"/>
    <text class="h-title" x="105" y="75" fill="#ffb86c" text-anchor="middle">IA</text>
    <text class="h-sub" x="105" y="93" text-anchor="middle">Inteligência Artificial</text>
    <text class="h-desc" x="105" y="112" text-anchor="middle">O Campo Amplo</text>
    <text class="h-desc" x="105" y="127" text-anchor="middle">Máquinas que raciocinam</text>

    <!-- CÍRCULO 2: ML (Verde) cx=255, cy=95, r=75 -->
    <circle cx="255" cy="95" r="74" fill="#21222c" stroke="#50fa7b" stroke-width="2" filter="url(#shadow-h)"/>
    <text class="h-title" x="255" y="75" fill="#50fa7b" text-anchor="middle">ML</text>
    <text class="h-sub" x="255" y="93" text-anchor="middle">Machine Learning</text>
    <text class="h-desc" x="255" y="112" text-anchor="middle">Aprende com Dados</text>
    <text class="h-desc" x="255" y="127" text-anchor="middle">Sem if/else manual</text>

    <!-- CÍRCULO 3: DEEP LEARNING (Roxo) cx=395, cy=95, r=68 -->
    <circle cx="395" cy="95" r="67" fill="#28263e" stroke="#bd93f9" stroke-width="2" filter="url(#shadow-h)"/>
    <text class="h-title" x="395" y="75" fill="#bd93f9" text-anchor="middle">DL</text>
    <text class="h-sub" x="395" y="93" text-anchor="middle">Deep Learning</text>
    <text class="h-desc" x="395" y="112" text-anchor="middle">Redes Profundas</text>
    <text class="h-desc" x="395" y="127" text-anchor="middle">Representações ricas</text>

    <!-- CÍRCULO 4: LLMs (Rosa) cx=530, cy=95, r=62 -->
    <circle cx="530" cy="95" r="61" fill="#362232" stroke="#ff79c6" stroke-width="2.2" filter="url(#shadow-h)"/>
    <text class="h-title" x="530" y="75" fill="#ff79c6" text-anchor="middle">LLMs</text>
    <text class="h-sub" x="530" y="93" text-anchor="middle">Large Language</text>
    <text class="h-desc" x="530" y="112" text-anchor="middle">Transformers</text>
    <text class="h-desc" x="530" y="127" text-anchor="middle">Motor de Linguagem</text>

    <!-- SETAS DE CONEXÃO DIRETA PARA O CARD DE PRODUTOS -->
    <path d="M 595 75 L 640 75" stroke="#8be9fd" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M 595 115 L 640 115" stroke="#8be9fd" stroke-width="2" fill="none"/>

    <!-- CARD / PÍLULA DE PRODUTOS E APLICAÇÕES VISÍVEIS (Azul Cyan) -->
    <g transform="translate(640, 20)" filter="url(#shadow-h)">
      <rect width="265" height="150" rx="16" fill="#1b2030" stroke="#8be9fd" stroke-width="2"/>
      
      <!-- Cabeçalho do Card -->
      <text style="font-family:'Inter',sans-serif;font-size:12px;font-weight:800;letter-spacing:1px;fill:#8be9fd;text-transform:uppercase" x="20" y="28">Aplicações Práticas</text>
      <text style="font-family:'Inter',sans-serif;font-size:9.5px;fill:#9aa1c0" x="20" y="44">O que o usuário final &amp; o dev usam:</text>

      <!-- Grade de Produtos -->
      <g transform="translate(18, 56)">
        <!-- ChatGPT -->
        <rect width="108" height="34" rx="8" fill="#21222c" stroke="#50fa7b" stroke-width="1"/>
        <text class="app-pill" x="12" y="21">ChatGPT</text>
        <text style="font-family:'Inter',sans-serif;font-size:8px;fill:#9aa1c0" x="65" y="21">OpenAI</text>

        <!-- Claude -->
        <g transform="translate(118, 0)">
          <rect width="108" height="34" rx="8" fill="#21222c" stroke="#ffb86c" stroke-width="1"/>
          <text class="app-pill" x="12" y="21">Claude</text>
          <text style="font-family:'Inter',sans-serif;font-size:8px;fill:#9aa1c0" x="55" y="21">Anthropic</text>
        </g>

        <!-- Gemini -->
        <g transform="translate(0, 42)">
          <rect width="108" height="34" rx="8" fill="#21222c" stroke="#8be9fd" stroke-width="1"/>
          <text class="app-pill" x="12" y="21">Gemini</text>
          <text style="font-family:'Inter',sans-serif;font-size:8px;fill:#9aa1c0" x="55" y="21">Google</text>
        </g>

        <!-- Agentes Dev / Cursor -->
        <g transform="translate(118, 42)">
          <rect width="108" height="34" rx="8" fill="#21222c" stroke="#bd93f9" stroke-width="1"/>
          <text class="app-pill" x="12" y="21">Agentes &amp; IDEs</text>
        </g>
      </g>
    </g>

  </g>
</svg>
