<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" style="background:#1e1f29;font-family:'Inter',system-ui,sans-serif">
  <text x="600" y="45" text-anchor="middle" fill="#f8f8f2" font-size="24" font-weight="800" letter-spacing="1">CLOUD STORAGE ARCHITECTURE &amp; LIFECYCLE TIERS</text>
  <text x="600" y="70" text-anchor="middle" fill="#6272a4" font-size="13" font-family="'Cascadia Code',monospace">Object Storage (S3) Lifecycle Transitions vs Block (EBS) vs File (EFS)</text>

  <!-- Top 3 Comparison Cards -->
  <rect x="60" y="110" width="340" height="200" rx="12" fill="#21222c" stroke="#50fa7b" stroke-width="1.5"/>
  <text x="85" y="140" fill="#50fa7b" font-size="13" font-weight="800">1. Object Storage (S3 / GCS)</text>
  <text x="85" y="165" fill="#f8f8f2" font-size="10.5">• Acesso via HTTP/HTTPS REST API</text>
  <text x="85" y="190" fill="#f8f8f2" font-size="10.5">• Chave-Valor com Metadados customizados</text>
  <text x="85" y="215" fill="#f8f8f2" font-size="10.5">• Escala ilimitada e 11 9's de durabilidade (99.999999999%)</text>
  <text x="85" y="240" fill="#f8f8f2" font-size="10.5">• Imutável: perfeito para logs, mídia, backups e data lake</text>
  <text x="85" y="275" fill="#50fa7b" font-size="11" font-weight="700">Custo: Baixíssimo ($0.023/GB)</text>

  <rect x="430" y="110" width="340" height="200" rx="12" fill="#21222c" stroke="#8be9fd" stroke-width="1.5"/>
  <text x="455" y="140" fill="#8be9fd" font-size="13" font-weight="800">2. Block Storage (EBS / Persistent Disk)</text>
  <text x="455" y="165" fill="#f8f8f2" font-size="10.5">• Anexado diretamente à VM (HD virtual)</text>
  <text x="455" y="190" fill="#f8f8f2" font-size="10.5">• Latência sub-milissegundo com IOPS provisionados</text>
  <text x="455" y="215" fill="#f8f8f2" font-size="10.5">• Apenas UMA instância conectada por vez</text>
  <text x="455" y="240" fill="#f8f8f2" font-size="10.5">• Ideal para arquivos de dados de SGBD (PostgreSQL, Oracle)</text>
  <text x="455" y="275" fill="#8be9fd" font-size="11" font-weight="700">Custo: Médio ($0.08 - $0.12/GB)</text>

  <rect x="800" y="110" width="340" height="200" rx="12" fill="#21222c" stroke="#bd93f9" stroke-width="1.5"/>
  <text x="825" y="140" fill="#bd93f9" font-size="13" font-weight="800">3. File Storage (EFS / Filestore)</text>
  <text x="825" y="165" fill="#f8f8f2" font-size="10.5">• Sistema de arquivos compartilhado NFS/SMB</text>
  <text x="825" y="190" fill="#f8f8f2" font-size="10.5">• Compatível com POSIX (permissões, diretórios)</text>
  <text x="825" y="215" fill="#f8f8f2" font-size="10.5">• Centenas de VMs e pods lendo e gravando juntos</text>
  <text x="825" y="240" fill="#f8f8f2" font-size="10.5">• Perfeito para CMS compartilhado e volumes K8s</text>
  <text x="825" y="275" fill="#bd93f9" font-size="11" font-weight="700">Custo: Alto ($0.30/GB)</text>

  <!-- Bottom S3 Lifecycle Pipeline -->
  <rect x="60" y="340" width="1080" height="295" rx="14" fill="#21222c" stroke="#44475a" stroke-width="2"/>
  <text x="85" y="375" fill="#ffb86c" font-size="14" font-weight="800">CICLO DE VIDA DE OBJETOS: OTIMIZAÇÃO AUTOMÁTICA DE CUSTOS (S3 LIFECYCLE)</text>

  <!-- Tier 1 -->
  <rect x="85" y="410" width="220" height="150" rx="10" fill="#282a36" stroke="#50fa7b"/>
  <text x="195" y="440" text-anchor="middle" fill="#50fa7b" font-size="12" font-weight="700">S3 Standard</text>
  <text x="195" y="465" text-anchor="middle" fill="#f8f8f2" font-size="10">Acesso frequente</text>
  <text x="195" y="485" text-anchor="middle" fill="#6272a4" font-size="9.5">Zero taxa de recuperação</text>
  <text x="195" y="515" text-anchor="middle" fill="#50fa7b" font-size="11" font-weight="700">$0.023 / GB</text>

  <!-- Transition 1 -->
  <path d="M305 485 L355 485" stroke="#ffb86c" stroke-width="2.5"/>
  <polygon points="355,480 365,485 355,490" fill="#ffb86c"/>
  <text x="335" y="465" text-anchor="middle" fill="#ffb86c" font-size="9" font-weight="700">30 dias</text>

  <!-- Tier 2 -->
  <rect x="365" y="410" width="220" height="150" rx="10" fill="#282a36" stroke="#8be9fd"/>
  <text x="475" y="440" text-anchor="middle" fill="#8be9fd" font-size="12" font-weight="700">S3 Infrequent Access</text>
  <text x="475" y="465" text-anchor="middle" fill="#f8f8f2" font-size="10">Acesso esporádico</text>
  <text x="475" y="485" text-anchor="middle" fill="#6272a4" font-size="9.5">Taxa por GB recuperado</text>
  <text x="475" y="515" text-anchor="middle" fill="#8be9fd" font-size="11" font-weight="700">$0.0125 / GB (-45%)</text>

  <!-- Transition 2 -->
  <path d="M585 485 L635 485" stroke="#ffb86c" stroke-width="2.5"/>
  <polygon points="635,480 645,485 635,490" fill="#ffb86c"/>
  <text x="610" y="465" text-anchor="middle" fill="#ffb86c" font-size="9" font-weight="700">90 dias</text>

  <!-- Tier 3 -->
  <rect x="645" y="410" width="220" height="150" rx="10" fill="#282a36" stroke="#bd93f9"/>
  <text x="755" y="440" text-anchor="middle" fill="#bd93f9" font-size="12" font-weight="700">S3 Glacier Flexible</text>
  <text x="755" y="465" text-anchor="middle" fill="#f8f8f2" font-size="10">Arquivo de longo prazo</text>
  <text x="755" y="485" text-anchor="middle" fill="#6272a4" font-size="9.5">Recuperação em minutos/horas</text>
  <text x="755" y="515" text-anchor="middle" fill="#bd93f9" font-size="11" font-weight="700">$0.0036 / GB (-84%)</text>

  <!-- Transition 3 -->
  <path d="M865 485 L915 485" stroke="#ff5555" stroke-width="2.5"/>
  <polygon points="915,480 925,485 915,490" fill="#ff5555"/>
  <text x="890" y="465" text-anchor="middle" fill="#ff5555" font-size="9" font-weight="700">365 dias</text>

  <!-- Tier 4 -->
  <rect x="925" y="410" width="190" height="150" rx="10" fill="#282a36" stroke="#ff5555"/>
  <text x="1020" y="440" text-anchor="middle" fill="#ff5555" font-size="12" font-weight="700">Glacier Deep Archive</text>
  <text x="1020" y="465" text-anchor="middle" fill="#f8f8f2" font-size="10">Compliance / Auditoria</text>
  <text x="1020" y="485" text-anchor="middle" fill="#6272a4" font-size="9.5">Recuperação em 12 horas</text>
  <text x="1020" y="515" text-anchor="middle" fill="#ff5555" font-size="11" font-weight="700">$0.00099 / GB (-95%)</text>

  <text x="85" y="590" fill="#50fa7b" font-size="11">Dica de FinOps: A transição automática via regras de Lifecycle reduz custos em até 95% sem intervenção humana manual.</text>
</svg>