<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" style="background:#1e1f29;font-family:'Inter',system-ui,sans-serif">
  <text x="600" y="45" text-anchor="middle" fill="#f8f8f2" font-size="24" font-weight="800" letter-spacing="1">THE CLOUD COMPUTE SPECTRUM &amp; SHARED RESPONSIBILITY</text>
  <text x="600" y="70" text-anchor="middle" fill="#6272a4" font-size="13" font-family="'Cascadia Code',monospace">From Bare Metal to Serverless: Control vs Operational Burden</text>

  <!-- 5 Columns -->
  <!-- Col 1: Bare Metal / On-Prem -->
  <rect x="60" y="110" width="190" height="490" rx="12" fill="#21222c" stroke="#6272a4" stroke-width="1.5"/>
  <text x="155" y="145" text-anchor="middle" fill="#6272a4" font-size="14" font-weight="800">On-Premises</text>
  <text x="155" y="165" text-anchor="middle" fill="#f8f8f2" font-size="10">Bare Metal</text>

  <rect x="75" y="185" width="160" height="390" rx="8" fill="#ff5555" opacity="0.15" stroke="#ff5555"/>
  <text x="155" y="215" text-anchor="middle" fill="#ff5555" font-size="11" font-weight="700">100% Cliente</text>
  <text x="155" y="245" text-anchor="middle" fill="#f8f8f2" font-size="9.5">Aplicações</text>
  <text x="155" y="285" text-anchor="middle" fill="#f8f8f2" font-size="9.5">Dados &amp; Carga</text>
  <text x="155" y="325" text-anchor="middle" fill="#f8f8f2" font-size="9.5">Runtime / JVM</text>
  <text x="155" y="365" text-anchor="middle" fill="#f8f8f2" font-size="9.5">Sistema Operacional</text>
  <text x="155" y="405" text-anchor="middle" fill="#f8f8f2" font-size="9.5">Virtualização</text>
  <text x="155" y="445" text-anchor="middle" fill="#f8f8f2" font-size="9.5">Servidores / Hardware</text>
  <text x="155" y="485" text-anchor="middle" fill="#f8f8f2" font-size="9.5">Rede Física</text>
  <text x="155" y="525" text-anchor="middle" fill="#f8f8f2" font-size="9.5">Energia / Datacenter</text>

  <!-- Col 2: IaaS -->
  <rect x="280" y="110" width="190" height="490" rx="12" fill="#21222c" stroke="#ffb86c" stroke-width="1.5"/>
  <text x="375" y="145" text-anchor="middle" fill="#ffb86c" font-size="14" font-weight="800">IaaS</text>
  <text x="375" y="165" text-anchor="middle" fill="#f8f8f2" font-size="10">EC2 / Compute Engine</text>

  <rect x="295" y="185" width="160" height="200" rx="8" fill="#ff5555" opacity="0.15" stroke="#ff5555"/>
  <text x="375" y="215" text-anchor="middle" fill="#ff5555" font-size="11" font-weight="700">Resp. Cliente</text>
  <text x="375" y="245" text-anchor="middle" fill="#f8f8f2" font-size="9.5">Aplicações</text>
  <text x="375" y="285" text-anchor="middle" fill="#f8f8f2" font-size="9.5">Dados</text>
  <text x="375" y="325" text-anchor="middle" fill="#f8f8f2" font-size="9.5">Runtime</text>
  <text x="375" y="365" text-anchor="middle" fill="#f8f8f2" font-size="9.5">SO Patching</text>

  <rect x="295" y="395" width="160" height="180" rx="8" fill="#50fa7b" opacity="0.15" stroke="#50fa7b"/>
  <text x="375" y="425" text-anchor="middle" fill="#50fa7b" font-size="11" font-weight="700">Resp. Provedor</text>
  <text x="375" y="465" text-anchor="middle" fill="#6272a4" font-size="9.5">Virtualização / KVM</text>
  <text x="375" y="505" text-anchor="middle" fill="#6272a4" font-size="9.5">Hardware Físico</text>
  <text x="375" y="545" text-anchor="middle" fill="#6272a4" font-size="9.5">Datacenter &amp; Energia</text>

