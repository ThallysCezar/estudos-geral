  <text x="595" y="165" text-anchor="middle" fill="#f8f8f2" font-size="10">EKS / GKE / ECS</text>

  <rect x="515" y="185" width="160" height="150" rx="8" fill="#ff5555" opacity="0.15" stroke="#ff5555"/>
  <text x="595" y="215" text-anchor="middle" fill="#ff5555" font-size="11" font-weight="700">Resp. Cliente</text>
  <text x="595" y="245" text-anchor="middle" fill="#f8f8f2" font-size="9.5">Container Imagem</text>
  <text x="595" y="285" text-anchor="middle" fill="#f8f8f2" font-size="9.5">Pods &amp; Ingress</text>
  <text x="595" y="315" text-anchor="middle" fill="#f8f8f2" font-size="9.5">Autoscaling</text>

  <rect x="515" y="345" width="160" height="230" rx="8" fill="#50fa7b" opacity="0.15" stroke="#50fa7b"/>
  <text x="595" y="375" text-anchor="middle" fill="#50fa7b" font-size="11" font-weight="700">Resp. Provedor</text>
  <text x="595" y="415" text-anchor="middle" fill="#6272a4" font-size="9.5">K8s Control Plane</text>
  <text x="595" y="455" text-anchor="middle" fill="#6272a4" font-size="9.5">etcd &amp; API Server</text>
  <text x="595" y="495" text-anchor="middle" fill="#6272a4" font-size="9.5">Node Provisioning</text>
  <text x="595" y="535" text-anchor="middle" fill="#6272a4" font-size="9.5">Infraestrutura Física</text>

  <!-- Col 4: PaaS -->
  <rect x="720" y="110" width="190" height="490" rx="12" fill="#21222c" stroke="#bd93f9" stroke-width="1.5"/>
  <text x="815" y="145" text-anchor="middle" fill="#bd93f9" font-size="14" font-weight="800">PaaS</text>
  <text x="815" y="165" text-anchor="middle" fill="#f8f8f2" font-size="10">App Service / Beanstalk</text>

  <rect x="735" y="185" width="160" height="100" rx="8" fill="#ff5555" opacity="0.15" stroke="#ff5555"/>
  <text x="815" y="215" text-anchor="middle" fill="#ff5555" font-size="11" font-weight="700">Resp. Cliente</text>
  <text x="815" y="245" text-anchor="middle" fill="#f8f8f2" font-size="9.5">Código da Aplicação</text>
  <text x="815" y="265" text-anchor="middle" fill="#f8f8f2" font-size="9.5">Configuração do App</text>

  <rect x="735" y="295" width="160" height="280" rx="8" fill="#50fa7b" opacity="0.15" stroke="#50fa7b"/>
  <text x="815" y="325" text-anchor="middle" fill="#50fa7b" font-size="11" font-weight="700">Resp. Provedor</text>
  <text x="815" y="365" text-anchor="middle" fill="#6272a4" font-size="9.5">Runtime / JVM Patch</text>
  <text x="815" y="405" text-anchor="middle" fill="#6272a4" font-size="9.5">Sistema Operacional</text>
  <text x="815" y="445" text-anchor="middle" fill="#6272a4" font-size="9.5">Escala Automática</text>
  <text x="815" y="485" text-anchor="middle" fill="#6272a4" font-size="9.5">Load Balancing</text>
  <text x="815" y="525" text-anchor="middle" fill="#6272a4" font-size="9.5">Infraestrutura Física</text>

  <!-- Col 5: Serverless / FaaS -->
  <rect x="940" y="110" width="200" height="490" rx="12" fill="#21222c" stroke="#50fa7b" stroke-width="2"/>
  <text x="1040" y="145" text-anchor="middle" fill="#50fa7b" font-size="14" font-weight="800">Serverless</text>
  <text x="1040" y="165" text-anchor="middle" fill="#f8f8f2" font-size="10">AWS Lambda / Cloud Run</text>

  <rect x="955" y="185" width="170" height="60" rx="8" fill="#ff5555" opacity="0.15" stroke="#ff5555"/>
  <text x="1040" y="210" text-anchor="middle" fill="#ff5555" font-size="11" font-weight="700">Resp. Cliente</text>
  <text x="1040" y="230" text-anchor="middle" fill="#f8f8f2" font-size="9.5">Função (Código Puro)</text>

  <rect x="955" y="255" width="170" height="320" rx="8" fill="#50fa7b" opacity="0.15" stroke="#50fa7b"/>
  <text x="1040" y="285" text-anchor="middle" fill="#50fa7b" font-size="11" font-weight="700">Resp. Provedor</text>
  <text x="1040" y="320" text-anchor="middle" fill="#6272a4" font-size="9.5">Escala para ZERO</text>
  <text x="1040" y="355" text-anchor="middle" fill="#6272a4" font-size="9.5">Provisionamento Milissegundo</text>
  <text x="1040" y="390" text-anchor="middle" fill="#6272a4" font-size="9.5">Segurança do Runtime</text>
  <text x="1040" y="425" text-anchor="middle" fill="#6272a4" font-size="9.5">Tolerância a Falhas</text>
  <text x="1040" y="460" text-anchor="middle" fill="#6272a4" font-size="9.5">Cobrança por Execução</text>
  <text x="1040" y="495" text-anchor="middle" fill="#6272a4" font-size="9.5">Infraestrutura Física</text>
  <text x="1040" y="535" text-anchor="middle" fill="#ff79c6" font-size="9.5">Atenção: Cold Start!</text>
</svg>