<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" style="background:#1e1f29;font-family:'Inter',system-ui,sans-serif">
  <text x="600" y="45" text-anchor="middle" fill="#f8f8f2" font-size="24" font-weight="800" letter-spacing="1">CLOUD IAM: IDENTITY, RESOURCE ROLES &amp; LEAST PRIVILEGE</text>
  <text x="600" y="70" text-anchor="middle" fill="#6272a4" font-size="13" font-family="'Cascadia Code',monospace">Eliminating Static Credentials with Instance Profiles &amp; Policy Evaluation</text>

  <!-- Main Container -->
  <rect x="40" y="100" width="1120" height="535" rx="16" fill="#282a36" stroke="#44475a" stroke-width="2"/>

  <!-- Left Box: Anti-Pattern vs Best Practice -->
  <rect x="70" y="140" width="460" height="455" rx="14" fill="#21222c" stroke="#ff5555" stroke-width="2"/>
  <rect x="90" y="155" width="260" height="28" rx="6" fill="#ff5555" opacity="0.2"/>
  <text x="105" y="174" fill="#ff5555" font-size="11" font-weight="700" font-family="'Cascadia Code',monospace">Identidade: O Que Mudou</text>

  <rect x="90" y="200" width="420" height="110" rx="8" fill="#191a21" stroke="#ff5555"/>
  <text x="110" y="225" fill="#ff5555" font-size="12" font-weight="800">❌ O ERRO CLÁSSICO: Chaves Estáticas no Código</text>
  <text x="110" y="250" fill="#6272a4" font-size="10" font-family="'Cascadia Code',monospace">AWS_ACCESS_KEY_ID = "AKIA..."</text>
  <text x="110" y="270" fill="#6272a4" font-size="10" font-family="'Cascadia Code',monospace">AWS_SECRET_ACCESS_KEY = "wJalrX..."</text>
  <text x="110" y="295" fill="#ff5555" font-size="10">Risco: Vazamento no Git, sem rotação, privilégio de root.</text>

  <rect x="90" y="330" width="420" height="235" rx="8" fill="#191a21" stroke="#50fa7b"/>
  <text x="110" y="358" fill="#50fa7b" font-size="12" font-weight="800">✅ O PADRÃO MODERNO: IAM Roles &amp; STS</text>
  <text x="110" y="385" fill="#f8f8f2" font-size="10.5">• A aplicação assume uma <b>IAM Role</b> temporária.</text>
  <text x="110" y="410" fill="#f8f8f2" font-size="10.5">• O serviço de metadados da nuvem (IMDSv2) entrega credenciais efêmeras que expiram a cada 6 horas.</text>
  <text x="110" y="435" fill="#f8f8f2" font-size="10.5">• <b>Zero chaves gravadas no código ou no container.</b></text>
  <text x="110" y="465" fill="#8be9fd" font-size="10.5">• AWS: IAM Roles for Service Accounts (IRSA)</text>
  <text x="110" y="490" fill="#8be9fd" font-size="10.5">• GCP: Workload Identity Federation</text>
  <text x="110" y="515" fill="#8be9fd" font-size="10.5">• Azure: Managed Identity para instâncias e apps</text>

  <!-- Right Box: Policy Structure -->
  <rect x="560" y="140" width="560" height="455" rx="14" fill="#21222c" stroke="#bd93f9" stroke-width="2"/>
  <rect x="580" y="155" width="270" height="28" rx="6" fill="#bd93f9" opacity="0.2"/>
  <text x="595" y="174" fill="#bd93f9" font-size="11" font-weight="700" font-family="'Cascadia Code',monospace">Anatomia de uma IAM Policy JSON</text>

  <rect x="580" y="200" width="520" height="365" rx="8" fill="#191a21" stroke="#44475a"/>
  <text x="600" y="225" fill="#6272a4" font-size="10.5" font-family="'Cascadia Code',monospace">{</text>
  <text x="620" y="245" fill="#6272a4" font-size="10.5" font-family="'Cascadia Code',monospace">  "Version": "2012-10-17",</text>
  <text x="620" y="265" fill="#6272a4" font-size="10.5" font-family="'Cascadia Code',monospace">  "Statement": [{</text>
  <text x="640" y="290" fill="#50fa7b" font-size="11" font-family="'Cascadia Code',monospace">    "Effect": "Allow",</text>
  <text x="800" y="290" fill="#6272a4" font-size="9.5">// Allow explícito (Default é Deny)</text>
  
  <text x="640" y="320" fill="#ff79c6" font-size="11" font-family="'Cascadia Code',monospace">    "Action": [</text>
  <text x="660" y="340" fill="#f8f8f2" font-size="10.5" font-family="'Cascadia Code',monospace">      "s3:GetObject",</text>
  <text x="660" y="360" fill="#f8f8f2" font-size="10.5" font-family="'Cascadia Code',monospace">      "s3:PutObject"</text>
  <text x="640" y="380" fill="#ff79c6" font-size="11" font-family="'Cascadia Code',monospace">    ],</text>
  <text x="800" y="350" fill="#6272a4" font-size="9.5">// Apenas as ações estritamente necessárias</text>

  <text x="640" y="410" fill="#8be9fd" font-size="11" font-family="'Cascadia Code',monospace">    "Resource": "arn:aws:s3:::meu-bucket/orders/*",</text>
  <text x="640" y="435" fill="#6272a4" font-size="9.5">// Nunca use wildcard "*" para recursos de produção!</text>

  <text x="640" y="465" fill="#ffb86c" font-size="11" font-family="'Cascadia Code',monospace">    "Condition": {</text>
  <text x="660" y="485" fill="#ffb86c" font-size="10.5" font-family="'Cascadia Code',monospace">      "Bool": { "aws:SecureTransport": "true" }</text>
  <text x="640" y="505" fill="#ffb86c" font-size="11" font-family="'Cascadia Code',monospace">    }</text>
  <text x="800" y="485" fill="#6272a4" font-size="9.5">// Obriga HTTPS</text>

  <text x="620" y="525" fill="#6272a4" font-size="10.5" font-family="'Cascadia Code',monospace">  }]</text>
  <text x="600" y="545" fill="#6272a4" font-size="10.5" font-family="'Cascadia Code',monospace">}</text>
</svg>