<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" style="background:#1e1f29;font-family:'Inter',system-ui,sans-serif">
  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" fill="#f8f8f2" font-size="24" font-weight="800" letter-spacing="1">SPRING RESILIENCE &amp; TRANSACTIONAL OUTBOX PATTERN</text>
  <text x="600" y="70" text-anchor="middle" fill="#6272a4" font-size="13" font-family="'Cascadia Code',monospace">Dual-Write Elimination with RabbitMQ &amp; Resilience4j Circuit Breakers</text>

  <!-- Main Container -->
  <rect x="40" y="100" width="1120" height="535" rx="16" fill="#282a36" stroke="#44475a" stroke-width="2"/>

  <!-- Zone 1: Database ACID Transaction -->
  <rect x="70" y="140" width="340" height="350" rx="14" fill="#21222c" stroke="#50fa7b" stroke-width="2"/>
  <rect x="90" y="155" width="220" height="26" rx="6" fill="#50fa7b" opacity="0.2"/>
  <text x="105" y="172" fill="#50fa7b" font-size="11" font-weight="700" font-family="'Cascadia Code',monospace">Passo 1: Transação ACID Local</text>
  
  <text x="240" y="215" text-anchor="middle" fill="#f8f8f2" font-size="13" font-weight="700">Banco de Dados Relacional</text>
  <text x="240" y="235" text-anchor="middle" fill="#6272a4" font-size="10.5">PostgreSQL / MySQL (Commit Atômico)</text>

  <rect x="95" y="260" width="290" height="85" rx="8" fill="#282a36" stroke="#bd93f9"/>
  <text x="115" y="285" fill="#bd93f9" font-size="11" font-weight="700">Tabela de Negócio: orders</text>
  <text x="115" y="305" fill="#f8f8f2" font-size="10" font-family="'Cascadia Code',monospace">id: 9812 | status: "APPROVED"</text>
  <text x="115" y="325" fill="#6272a4" font-size="9.5">Regra de domínio persistida</text>

  <rect x="95" y="365" width="290" height="95" rx="8" fill="#282a36" stroke="#ffb86c"/>
  <text x="115" y="390" fill="#ffb86c" font-size="11" font-weight="700">Tabela Outbox: outbox_events</text>
  <text x="115" y="410" fill="#f8f8f2" font-size="10" font-family="'Cascadia Code',monospace">event_id: uuid | payload: JSON</text>
  <text x="115" y="430" fill="#50fa7b" font-size="9.5">processed: false</text>
  <text x="115" y="445" fill="#6272a4" font-size="9">Mesma conexão JDBC! Sem 2PC.</text>

  <!-- Arrow between Zone 1 and Zone 2 -->
  <path d="M410 315 L470 315" stroke="#50fa7b" stroke-width="3"/>
  <polygon points="470,310 480,315 470,320" fill="#50fa7b"/>
  <text x="445" y="300" text-anchor="middle" fill="#50fa7b" font-size="10" font-weight="700">Polling / CDC</text>

  <!-- Zone 2: Outbox Relayer / Poller -->
  <rect x="480" y="140" width="250" height="350" rx="14" fill="#21222c" stroke="#8be9fd" stroke-width="2"/>
  <rect x="500" y="155" width="180" height="26" rx="6" fill="#8be9fd" opacity="0.2"/>
  <text x="515" y="172" fill="#8be9fd" font-size="11" font-weight="700" font-family="'Cascadia Code',monospace">Passo 2: Event Relay</text>

  <text x="605" y="215" text-anchor="middle" fill="#f8f8f2" font-size="13" font-weight="700">Spring Scheduled / Debezium</text>
  <text x="605" y="235" text-anchor="middle" fill="#6272a4" font-size="10.5">Lê eventos não processados</text>

  <rect x="500" y="260" width="210" height="95" rx="8" fill="#282a36" stroke="#44475a"/>
  <text x="515" y="285" fill="#8be9fd" font-size="11" font-weight="700">Publisher Confirms</text>
  <text x="515" y="305" fill="#f8f8f2" font-size="10">RabbitTemplate.send()</text>
  <text x="515" y="325" fill="#6272a4" font-size="9.5">Aguarda ack do broker</text>
  <text x="515" y="340" fill="#50fa7b" font-size="9.5">Atualiza: processed = true</text>

  <rect x="500" y="375" width="210" height="85" rx="8" fill="#282a36" stroke="#ff79c6"/>
  <text x="515" y="400" fill="#ff79c6" font-size="11" font-weight="700">Resilience4j Circuit Breaker</text>
  <text x="515" y="420" fill="#f8f8f2" font-size="10">Estado: CLOSED (Normal)</text>
  <text x="515" y="440" fill="#ff5555" font-size="9.5">Abre se o broker cair!</text>

  <!-- Arrow between Zone 2 and Zone 3 -->
  <path d="M730 315 L780 315" stroke="#ff79c6" stroke-width="3"/>
  <polygon points="780,310 790,315 780,320" fill="#ff79c6"/>
  <text x="755" y="300" text-anchor="middle" fill="#ff79c6" font-size="10" font-weight="700">AMQP</text>

  <!-- Zone 3: RabbitMQ Broker & Dead Letter Exchange -->
  <rect x="790" y="140" width="340" height="350" rx="14" fill="#21222c" stroke="#ffb86c" stroke-width="2"/>
  <rect x="810" y="155" width="180" height="26" rx="6" fill="#ffb86c" opacity="0.2"/>
  <text x="825" y="172" fill="#ffb86c" font-size="11" font-weight="700" font-family="'Cascadia Code',monospace">Passo 3: Mensageria</text>

  <text x="960" y="215" text-anchor="middle" fill="#f8f8f2" font-size="13" font-weight="700">RabbitMQ Broker</text>
  <text x="960" y="235" text-anchor="middle" fill="#6272a4" font-size="10.5">Roteamento e Confiabilidade</text>

  <rect x="815" y="260" width="290" height="75" rx="8" fill="#282a36" stroke="#ffb86c"/>
  <text x="830" y="285" fill="#ffb86c" font-size="11" font-weight="700">Exchange: orders.exchange (Direct)</text>
  <text x="830" y="305" fill="#f8f8f2" font-size="10" font-family="'Cascadia Code',monospace">Routing Key: "order.created"</text>
  <text x="830" y="322" fill="#8be9fd" font-size="9.5">Fila Principal: orders.created.queue</text>

  <rect x="815" y="355" width="290" height="105" rx="8" fill="#282a36" stroke="#ff5555"/>
  <text x="830" y="380" fill="#ff5555" font-size="11" font-weight="700">DLX (Dead Letter Exchange)</text>
  <text x="830" y="400" fill="#f8f8f2" font-size="10">Após 3 tentativas com Retry backoff</text>
  <text x="830" y="420" fill="#6272a4" font-size="9.5">Fila: orders.created.dlq</text>
  <text x="830" y="440" fill="#50fa7b" font-size="9.5">Zero perda de dados em falhas!</text>

  <!-- Bottom Explanatory Bar -->
  <rect x="70" y="515" width="1060" height="95" rx="10" fill="#21222c" stroke="#44475a"/>
  <text x="100" y="542" fill="#50fa7b" font-size="12" font-weight="700">POR QUE O OUTBOX PATTERN É OBRIGATÓRIO EM MICROSSERVIÇOS?</text>
  <text x="100" y="565" fill="#f8f8f2" font-size="11">• <b>Eliminação de Dual-Write</b>: Tentar gravar no banco e enviar mensagem na mesma chamada direta quebra se a rede falhar após o commit.</text>
  <text x="100" y="588" fill="#f8f8f2" font-size="11">• <b>Garantia At-Least-Once</b>: Todo evento é garantidamente entregue ao broker; o consumidor precisa apenas de idempotência.</text>
</svg>