<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" style="background:#1e1f29;font-family:'Inter',system-ui,sans-serif">
  <defs>
    <linearGradient id="gradSec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff79c6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#bd93f9" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glowSec" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" fill="#f8f8f2" font-size="24" font-weight="800" letter-spacing="1">SPRING SECURITY 6: SECURITY FILTER CHAIN &amp; OAUTH2 JWT</text>
  <text x="600" y="70" text-anchor="middle" fill="#6272a4" font-size="13" font-family="'Cascadia Code',monospace">HTTP Request Authorization Flow &amp; Resource Server Validation</text>

  <!-- Outer FilterChain Container -->
  <rect x="40" y="100" width="1120" height="535" rx="16" fill="#282a36" stroke="#44475a" stroke-width="2"/>
  <rect x="60" y="115" width="220" height="30" rx="8" fill="#bd93f9" opacity="0.2"/>
  <text x="75" y="135" fill="#bd93f9" font-size="12" font-weight="700" font-family="'Cascadia Code',monospace">SecurityFilterChain Proxy</text>

  <!-- Incoming Request -->
  <rect x="70" y="240" width="130" height="150" rx="12" fill="#21222c" stroke="#bd93f9" stroke-width="1.5"/>
  <text x="135" y="275" text-anchor="middle" fill="#50fa7b" font-size="14" font-weight="700">HTTP Client</text>
  <text x="135" y="300" text-anchor="middle" fill="#f8f8f2" font-size="11">GET /api/orders</text>
  <rect x="85" y="320" width="100" height="45" rx="6" fill="#191a21" stroke="#6272a4" stroke-width="1"/>
  <text x="135" y="340" text-anchor="middle" fill="#8be9fd" font-size="9" font-family="'Cascadia Code',monospace">Header:</text>
  <text x="135" y="355" text-anchor="middle" fill="#ff79c6" font-size="9" font-family="'Cascadia Code',monospace">Bearer &lt;JWT&gt;</text>

  <!-- Arrow to FilterChain -->
  <path d="M200 315 L250 315" stroke="#bd93f9" stroke-width="2.5" stroke-dasharray="4 2"/>
  <polygon points="250,311 258,315 250,319" fill="#bd93f9"/>

  <!-- Step 1: Web & Perimeter Filters -->
  <rect x="260" y="170" width="160" height="300" rx="12" fill="#21222c" stroke="#6272a4" stroke-width="1.5"/>
  <text x="340" y="200" text-anchor="middle" fill="#8be9fd" font-size="13" font-weight="700">1. Web Filters</text>
  
  <rect x="275" y="225" width="130" height="60" rx="8" fill="#282a36" stroke="#44475a"/>
  <text x="340" y="250" text-anchor="middle" fill="#f8f8f2" font-size="11" font-weight="600">CorsFilter</text>
  <text x="340" y="270" text-anchor="middle" fill="#6272a4" font-size="9.5">Valida Origin / Headers</text>

  <rect x="275" y="300" width="130" height="60" rx="8" fill="#282a36" stroke="#44475a"/>
  <text x="340" y="325" text-anchor="middle" fill="#f8f8f2" font-size="11" font-weight="600">CsrfFilter</text>
  <text x="340" y="345" text-anchor="middle" fill="#6272a4" font-size="9.5">Ignora em APIs stateless</text>

  <rect x="275" y="375" width="130" height="65" rx="8" fill="#282a36" stroke="#44475a"/>
  <text x="340" y="400" text-anchor="middle" fill="#f8f8f2" font-size="11" font-weight="600">HeaderWriter</text>
  <text x="340" y="420" text-anchor="middle" fill="#6272a4" font-size="9.5">HSTS, X-Content-Type</text>

  <!-- Arrow -->
  <path d="M420 315 L470 315" stroke="#bd93f9" stroke-width="2.5"/>
  <polygon points="470,311 478,315 470,319" fill="#bd93f9"/>

  <!-- Step 2: Bearer Token Auth Filter -->
  <rect x="480" y="170" width="190" height="300" rx="12" fill="#21222c" stroke="#ff79c6" stroke-width="2"/>
  <text x="575" y="200" text-anchor="middle" fill="#ff79c6" font-size="13" font-weight="700">2. Bearer Authentication</text>

  <rect x="495" y="225" width="160" height="75" rx="8" fill="#282a36" stroke="#ff79c6" stroke-width="1"/>
  <text x="575" y="248" text-anchor="middle" fill="#f8f8f2" font-size="11" font-weight="600">BearerTokenAuthFilter</text>
  <text x="575" y="268" text-anchor="middle" fill="#8be9fd" font-size="9.5">Extrai token string</text>
  <text x="575" y="285" text-anchor="middle" fill="#6272a4" font-size="9">Bearer eyJhbGciOi...</text>

  <rect x="495" y="315" width="160" height="125" rx="8" fill="#282a36" stroke="#44475a"/>
  <text x="575" y="340" text-anchor="middle" fill="#50fa7b" font-size="11" font-weight="600">JwtDecoder (JWKS)</text>
  <text x="575" y="360" text-anchor="middle" fill="#6272a4" font-size="9.5">1. Valida assinatura RSA</text>
  <text x="575" y="380" text-anchor="middle" fill="#6272a4" font-size="9.5">2. Valida exp / nbf / iss</text>
  <text x="575" y="400" text-anchor="middle" fill="#6272a4" font-size="9.5">3. Converte claims</text>
  <text x="575" y="420" text-anchor="middle" fill="#f1fa8c" font-size="9">Chave Pública Cacheada</text>

  <!-- Arrow -->
  <path d="M670 315 L720 315" stroke="#bd93f9" stroke-width="2.5"/>
  <polygon points="720,311 728,315 720,319" fill="#bd93f9"/>

  <!-- Step 3: SecurityContext & Authentication -->
  <rect x="730" y="170" width="190" height="300" rx="12" fill="#21222c" stroke="#50fa7b" stroke-width="2"/>
  <text x="825" y="200" text-anchor="middle" fill="#50fa7b" font-size="13" font-weight="700">3. SecurityContext</text>

  <rect x="745" y="225" width="160" height="110" rx="8" fill="#282a36" stroke="#50fa7b" stroke-width="1"/>
  <text x="825" y="250" text-anchor="middle" fill="#f8f8f2" font-size="11" font-weight="600">SecurityContextHolder</text>
  <text x="825" y="272" text-anchor="middle" fill="#8be9fd" font-size="9.5">JwtAuthenticationToken</text>
  <rect x="755" y="285" width="140" height="38" rx="4" fill="#191a21"/>
  <text x="825" y="300" text-anchor="middle" fill="#bd93f9" font-size="9" font-family="'Cascadia Code',monospace">Principal: "user_102"</text>
  <text x="825" y="315" text-anchor="middle" fill="#50fa7b" font-size="9" font-family="'Cascadia Code',monospace">Roles: [ROLE_ADMIN]</text>

  <rect x="745" y="350" width="160" height="90" rx="8" fill="#282a36" stroke="#44475a"/>
  <text x="825" y="375" text-anchor="middle" fill="#f8f8f2" font-size="11" font-weight="600">ThreadLocal Storage</text>
  <text x="825" y="395" text-anchor="middle" fill="#6272a4" font-size="9.5">Acesso síncrono na thread</text>
  <text x="825" y="415" text-anchor="middle" fill="#ffb86c" font-size="9.5">Limpo no fim da requisição</text>

  <!-- Arrow -->
  <path d="M920 315 L970 315" stroke="#bd93f9" stroke-width="2.5"/>
  <polygon points="970,311 978,315 970,319" fill="#bd93f9"/>

  <!-- Step 4: Method Security Authorization -->
  <rect x="980" y="170" width="150" height="300" rx="12" fill="#21222c" stroke="#f1fa8c" stroke-width="1.5"/>
  <text x="1055" y="200" text-anchor="middle" fill="#f1fa8c" font-size="13" font-weight="700">4. Autorização</text>

  <rect x="995" y="235" width="120" height="95" rx="8" fill="#282a36" stroke="#44475a"/>
  <text x="1055" y="260" text-anchor="middle" fill="#ff79c6" font-size="10" font-family="'Cascadia Code',monospace">@PreAuthorize</text>
  <text x="1055" y="280" text-anchor="middle" fill="#8be9fd" font-size="9" font-family="'Cascadia Code',monospace">hasRole('ADMIN')</text>
  <path d="M1010 295 L1100 295" stroke="#44475a" stroke-width="1"/>
  <text x="1055" y="315" text-anchor="middle" fill="#50fa7b" font-size="10" font-weight="700">200 OK / Logic</text>

  <rect x="995" y="345" width="120" height="75" rx="8" fill="#282a36" stroke="#ff5555" stroke-width="1"/>
  <text x="1055" y="375" text-anchor="middle" fill="#ff5555" font-size="11" font-weight="700">Acesso Negado</text>
  <text x="1055" y="398" text-anchor="middle" fill="#6272a4" font-size="9">403 Forbidden</text>

  <!-- Bottom Checklist Notes -->
  <rect x="60" y="520" width="1080" height="95" rx="10" fill="#21222c" stroke="#44475a"/>
  <text x="90" y="548" fill="#50fa7b" font-size="12" font-weight="700">BOAS PRÁTICAS EM PRODUÇÃO:</text>
  <text x="90" y="572" fill="#f8f8f2" font-size="11">• <b>Stateless Session</b>: SessionCreationPolicy.STATELESS garante que o servidor não guarda estado e escala horizontalmente.</text>
  <text x="90" y="595" fill="#f8f8f2" font-size="11">• <b>JWKS Caching</b>: O Spring baixa a chave pública do Identity Provider (Keycloak/Okta) e faz cache para não onerar o IdP a cada chamada.</text>
</svg>