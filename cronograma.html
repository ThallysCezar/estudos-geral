<style>
:root{color-scheme:dark;--bg:#282a36;--panel:#21222c;--ink:#f8f8f2;--muted:#9aa1c0;--cyan:#8be9fd;font-family:Inter,"Segoe UI",system-ui,sans-serif}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--ink);padding:20px}
.box{max-width:480px;width:100%;padding:34px 28px;border-radius:24px;border:1px solid #44475a88;background:var(--panel);text-align:center;box-shadow:0 24px 60px #00000066}
h1{font:500 1.6rem Georgia,serif;margin:0 0 12px;color:var(--ink)}
p{color:var(--muted);font-size:.92rem;line-height:1.6;margin:0 0 24px}
a{display:inline-block;text-decoration:none;padding:12px 24px;border-radius:999px;background:color-mix(in srgb,var(--cyan) 16%,transparent);border:1px solid color-mix(in srgb,var(--cyan) 60%,transparent);color:var(--cyan);font-weight:600;font-size:.88rem;transition:.2s}
a:hover{background:color-mix(in srgb,var(--cyan) 28%,transparent)}
</style>
