<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" style="background:#1e1f29;font-family:'Inter',system-ui,sans-serif">
  <text x="600" y="45" text-anchor="middle" fill="#f8f8f2" font-size="24" font-weight="800" letter-spacing="1">CLOUD VPC NETWORK ARCHITECTURE</text>
  <text x="600" y="70" text-anchor="middle" fill="#6272a4" font-size="13" font-family="'Cascadia Code',monospace">Public &amp; Private Subnets, Route Tables, NAT Gateway &amp; Perimeter Defense</text>

  <!-- AWS Region Box -->
  <rect x="40" y="95" width="1120" height="545" rx="16" fill="#282a36" stroke="#44475a" stroke-width="2"/>
  <rect x="60" y="110" width="220" height="28" rx="6" fill="#bd93f9" opacity="0.2"/>
  <text x="75" y="128" fill="#bd93f9" font-size="12" font-weight="700" font-family="'Cascadia Code',monospace">VPC (CIDR: 10.0.0.0/16)</text>

  <!-- Internet & IGW -->
  <rect x="60" y="270" width="100" height="100" rx="50" fill="#21222c" stroke="#50fa7b" stroke-width="2"/>
  <text x="110" y="315" text-anchor="middle" fill="#50fa7b" font-size="13" font-weight="700">Internet</text>
  <text x="110" y="335" text-anchor="middle" fill="#6272a4" font-size="9.5">0.0.0.0/0</text>

  <path d="M160 320 L210 320" stroke="#50fa7b" stroke-width="2.5"/>
  <polygon points="210,315 220,320 210,325" fill="#50fa7b"/>

  <rect x="220" y="270" width="100" height="100" rx="12" fill="#21222c" stroke="#8be9fd" stroke-width="2"/>
  <text x="270" y="315" text-anchor="middle" fill="#8be9fd" font-size="13" font-weight="700">IGW</text>
  <text x="270" y="335" text-anchor="middle" fill="#6272a4" font-size="9.5">Internet Gateway</text>

  <path d="M320 320 L370 320" stroke="#8be9fd" stroke-width="2.5"/>
  <polygon points="370,315 380,320 370,325" fill="#8be9fd"/>

  <!-- Public Subnet -->
  <rect x="380" y="150" width="340" height="460" rx="14" fill="#21222c" stroke="#50fa7b" stroke-width="2"/>
  <rect x="400" y="165" width="220" height="26" rx="6" fill="#50fa7b" opacity="0.2"/>
  <text x="415" y="182" fill="#50fa7b" font-size="11" font-weight="700" font-family="'Cascadia Code',monospace">Sub-rede Pública (10.0.1.0/24)</text>

  <rect x="405" y="210" width="290" height="90" rx="8" fill="#282a36" stroke="#44475a"/>
  <text x="425" y="235" fill="#8be9fd" font-size="11" font-weight="700">Application Load Balancer (ALB)</text>
  <text x="425" y="255" fill="#f8f8f2" font-size="10">IP Público Elástico · TLS Termination</text>
  <text x="425" y="275" fill="#6272a4" font-size="9.5">Distribui tráfego para os containers privados</text>

  <rect x="405" y="320" width="290" height="100" rx="8" fill="#282a36" stroke="#ffb86c"/>
  <text x="425" y="345" fill="#ffb86c" font-size="11" font-weight="700">NAT Gateway (Gerenciado)</text>
  <text x="425" y="365" fill="#f8f8f2" font-size="10">Permite saída de rede para as instâncias privadas</text>
  <text x="425" y="385" fill="#50fa7b" font-size="9.5">Bloqueia conexões de entrada diretas da Internet</text>
  <text x="425" y="405" fill="#6272a4" font-size="9">IP Fixo EIP para egress</text>

  <rect x="405" y="440" width="290" height="145" rx="8" fill="#191a21" stroke="#44475a"/>
  <text x="425" y="465" fill="#bd93f9" font-size="11" font-weight="700">Route Table Pública</text>
  <text x="425" y="490" fill="#f8f8f2" font-size="9.5" font-family="'Cascadia Code',monospace">10.0.0.0/16 → local (Tráfego interno VPC)</text>
  <text x="425" y="515" fill="#50fa7b" font-size="9.5" font-family="'Cascadia Code',monospace">0.0.0.0/0   → igw-xxxx (Rota padrão Internet)</text>
  <path d="M420 530 L680 530" stroke="#44475a" stroke-width="1"/>
  <text x="425" y="555" fill="#ff79c6" font-size="9.5">Network ACL: Stateless (Portas 80, 443)</text>

  <!-- Arrow between Public and Private -->
  <path d="M720 370 L770 370" stroke="#ffb86c" stroke-width="2.5"/>
  <polygon points="770,365 780,370 770,375" fill="#ffb86c"/>

  <!-- Private Subnet -->
  <rect x="780" y="150" width="350" height="460" rx="14" fill="#21222c" stroke="#ff79c6" stroke-width="2"/>
  <rect x="800" y="165" width="230" height="26" rx="6" fill="#ff79c6" opacity="0.2"/>
  <text x="815" y="182" fill="#ff79c6" font-size="11" font-weight="700" font-family="'Cascadia Code',monospace">Sub-rede Privada (10.0.2.0/24)</text>

  <rect x="805" y="210" width="300" height="100" rx="8" fill="#282a36" stroke="#44475a"/>
  <text x="825" y="235" fill="#50fa7b" font-size="11" font-weight="700">Backend App (ECS / EKS / EC2)</text>
  <text x="825" y="255" fill="#f8f8f2" font-size="10">IPs estritamente privados (RFC 1918)</text>
  <text x="825" y="275" fill="#8be9fd" font-size="9.5">Security Group: Inbound só do ALB (porta 8080)</text>
  <text x="825" y="295" fill="#6272a4" font-size="9">Inacessível diretamente de fora</text>

  <rect x="805" y="325" width="300" height="95" rx="8" fill="#282a36" stroke="#bd93f9"/>
  <text x="825" y="350" fill="#bd93f9" font-size="11" font-weight="700">Banco de Dados (RDS PostgreSQL)</text>
  <text x="825" y="370" fill="#f8f8f2" font-size="10">Multi-AZ com replicação síncrona</text>
  <text x="825" y="390" fill="#ff5555" font-size="9.5">Security Group: Inbound só do Backend (5432)</text>
  <text x="825" y="405" fill="#6272a4" font-size="9">Zero acesso externo à Internet</text>

  <rect x="805" y="440" width="300" height="145" rx="8" fill="#191a21" stroke="#44475a"/>
  <text x="825" y="465" fill="#ffb86c" font-size="11" font-weight="700">Route Table Privada</text>
  <text x="825" y="490" fill="#f8f8f2" font-size="9.5" font-family="'Cascadia Code',monospace">10.0.0.0/16 → local (Tráfego interno)</text>
  <text x="825" y="515" fill="#ffb86c" font-size="9.5" font-family="'Cascadia Code',monospace">0.0.0.0/0   → nat-xxxx (Saída via NAT Gateway)</text>
  <path d="M820 530 L1080 530" stroke="#44475a" stroke-width="1"/>
  <text x="825" y="555" fill="#50fa7b" font-size="9.5">Security Groups: Stateful (Retorno automático)</text>
</svg>