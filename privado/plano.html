<title>Área restrita</title>
<style>
:root{--bg:#282a36;--card:#343746;--ink:#f8f8f2;--muted:#9aa0b8;--brand:#bd93f9;--red:#ff5555}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:400 1rem/1.5 "Inter","Segoe UI",system-ui,sans-serif;padding:16px}
form{width:min(380px,100%);background:var(--card);border-radius:16px;padding:1.6rem;box-shadow:0 20px 60px rgba(0,0,0,.35)}
h1{font-size:1.15rem;margin:0 0 .3rem}
p{color:var(--muted);font-size:.9rem;margin:0 0 1rem}
input{width:100%;padding:.8rem .9rem;border:1px solid #44475a;border-radius:10px;background:var(--bg);color:var(--ink);font-size:1rem}
input:focus{outline:2px solid var(--brand);border-color:transparent}
button{margin-top:.8rem;width:100%;padding:.8rem;border:0;border-radius:10px;background:var(--brand);color:#1e1f29;font-weight:700;font-size:1rem;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
#erro{color:var(--red);font-size:.88rem;min-height:1.3em;margin:.6rem 0 0}
a{color:var(--muted);font-size:.85rem}
</style>
</head>
